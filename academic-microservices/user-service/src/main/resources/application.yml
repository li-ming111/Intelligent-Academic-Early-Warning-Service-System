server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: user-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
    compatibility-verifier:
      enabled: false

  config:
    import-check:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/academic_warning_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 2026-10-01：原来这里是裸字面量 `root`，是**唯一一个**没有 `${DB_PASSWORD:...}` 兜底的连库服务
    # （其余 10 个都有）。后果：把 MySQL 口令改成非 root 时，其它服务全正常，唯独**全站唯一的登录
    # 入口**（`/api/auth/**` 挂在 user-service 上）连不上库 —— 最难查的那种"只有登录坏"。
    # 默认值仍是 root，所以本地开箱即用的行为**一字未变**，只是现在可以用环境变量覆盖了。
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    database: 0
    password: 

  security:
    user:
      name: admin
      password: admin123

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${server.port}

mybatis-plus:
  type-aliases-package: com.academic.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.academic: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  charset:
    console: UTF-8
