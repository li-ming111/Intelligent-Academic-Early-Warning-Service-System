server:
  port: 8070

spring:
  application:
    name: admin-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        register-enabled: true
        namespace: public
      config:
        import-check:
          enabled: false
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/academic_warning_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&tinyInt1isBit=false
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2026-09-30 补：本服务原来没配 multipart，Spring 默认单文件 1MB，
  # 而 importStudents 里那句校验写的是"不能超过 10MB" —— 2MB 的文件会先被容器
  # 拦成 MaxUploadSizeExceededException（500），根本走不到那句提示，等于谎话。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 运行时数据库备份/恢复（W1.10，见 BackupService）。
# mysqldump / mysql **不在 PATH 上**，所以显式配绝对路径；换机器时改这两行
# （或设同名环境变量）即可。取不到时不做 fail-fast —— 本工程没有启动脚本，
# 让服务起不来比"这次备份失败"更糟。
app:
  backup:
    mysqldump: ${MYSQLDUMP_PATH:D:/JAVA/mysql/mysql-8.0.44-winx64/mysql-8.0.44-winx64/bin/mysqldump.exe}
    mysql: ${MYSQL_CLIENT_PATH:D:/JAVA/mysql/mysql-8.0.44-winx64/mysql-8.0.44-winx64/bin/mysql.exe}

mybatis-plus:
  type-aliases-package: com.academic.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.academic: DEBUG
