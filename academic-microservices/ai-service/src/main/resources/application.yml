server:
  port: 8071

spring:
  application:
    name: ai-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        register-enabled: true
        namespace: public
      config:
        import-check:
          enabled: false
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/academic_warning_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&tinyInt1isBit=false
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

# DeepSeek AI 配置（OpenAI 兼容接口）
# 前缀固定用 ai.*：若写成 deepseek.api-key，系统里的 DEEPSEEK_API_KEY 环境变量
# 会经 Spring 宽松绑定把它覆盖掉，yml 里的 key 就会静默失效。
# 密钥只从环境变量 AI_API_KEY 读取，源码与仓库内不留明文；未设置时 AI 返回未配置提示。
ai:
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-chat}
  base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}

mybatis-plus:
  type-aliases-package: com.academic.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    root: INFO
    com.academic: DEBUG
