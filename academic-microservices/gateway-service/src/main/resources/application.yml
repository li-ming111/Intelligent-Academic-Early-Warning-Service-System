server:
  port: 8076

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        register-enabled: true
        namespace: public
      config:
        import-check:
          enabled: false
    gateway:
      jwt:
        secret: ${JWT_SECRET:academic-jwt-secret-key-for-academic-warning-system-2026}
      discovery:
        locator:
          enabled: true
      default-filters:
        - name: RequestSize
          args:
            maxSize: 10MB
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "Content-Type,Authorization"
            allowCredentials: false
            maxAge: 3600
      routes:
        - id: college-service
          uri: lb://college-service
          predicates:
            - Path=/api/colleges/**
          filters:
            - StripPrefix=1
        - id: college-service-auth
          uri: lb://college-service
          predicates:
            - Path=/api/auth/colleges
          filters:
            - StripPrefix=2
            - RewritePath=/colleges, /colleges/all
        - id: major-service-auth
          uri: lb://college-service
          predicates:
            - Path=/api/auth/majors
          filters:
            - StripPrefix=2
            - RewritePath=/majors, /majors/all
        # 班级目录（登录前的注册页选班级用）。必须**排在上面 auth-service-main
        # （Path=/api/auth/**）之前**：路由按先后顺序匹配，放后面就永远轮不到它。
        # 落到 college-service 的 /classes/all（2026-09-30 才实现，此前这个地址
        # 只会被 /api/auth/** 兜底吃进 user-service，得到 404）。
        - id: class-service-auth
          uri: lb://college-service
          predicates:
            - Path=/api/auth/classes
          filters:
            - StripPrefix=2
            - RewritePath=/classes, /classes/all
        # 注意：这里**不能**加 StripPrefix=1。user-service 是全部 13 个服务里
        # 唯一配了 server.servlet.context-path: /api 的，它对外暴露的路径本来就带 /api。
        # 加上 StripPrefix=1 会剥成 /users/**，服务端要的是 /api/users/** → 一律 404。
        # 下面 auth-service-main 指向同一个服务、没有 StripPrefix，所以一直是好的。
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: auth-service-main
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**
          filters:
            - StripPrefix=1
        # 排课面（W48，2026-10-17）：CoursePlanController 的 `/course-plans/**`。
        # ⚠️ 必须**单独一条**：`/api/courses/**` 前缀**不覆盖** `/api/course-plans/**`
        #    （`courses` ≠ `course-plans`，差在 `-plans`）。StripPrefix=1 与上面同型
        #    （剥掉 `/api` ⇒ 下游 `/course-plans/**`，正是 CoursePlanController 的映射）。
        #    配套闸：网关 `PREFIX_COURSE_PLANS` + course-service SecurityConfig 的
        #    `/course-plans/**` —— **先闸后路由**，别只加路由。
        - id: course-plans-service
          uri: lb://course-service
          predicates:
            - Path=/api/course-plans/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/roles/**,/api/permissions/**,/api/role-permissions/**
          filters:
            - StripPrefix=1
        # 2026-10-01 第二十三轮：原来这里有一条 `message-service`（Path=/api/messages/**
        # + StripPrefix=1），已删。两个理由：
        #  ① 它**本来就是坏的**：StripPrefix=1 会把 /api 剥掉转发成 /messages/**，而
        #     MessageController 的映射是 {"/api/messages","/students/messages",
        #     "/teachers/messages"}（message-service 没有 context-path）⇒ 永远对不上，
        #     实测过网关回 500 `No static resource messages`、直连 8077 同请求 200。
        #     改法是去掉 StripPrefix=1（与上面 user-service 那条同型），但见 ②。
        #  ② 全仓**没有任何调用方**走它：PC 端打 /students/messages/**（走下面 student-service
        #     路由）、/teachers/messages/**（teacher-service）、/admin/messages/**（admin-service），
        #     小程序零处。message-service 唯一消费者是 admin-service 的 MessageServiceClient
        #     —— 那是 Feign 直连 lb://，不过网关。
        #  ⇒ 与其修好一条没人走的路（修好等于把该控制器 13 个映射里 8 个不做归属校验的
        #     端点新暴露到网关），不如删掉。**别再加回来。**
        # 注意下面 message-service-ws（/ws/**）是另一条、没带 StripPrefix，与 /ws 控制器
        # 正好对上，是好的，不要跟着删。
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/students/**
          filters:
            - StripPrefix=1
        - id: teacher-service
          uri: lb://teacher-service
          predicates:
            - Path=/api/teachers/**
          filters:
            - StripPrefix=1
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
        - id: college-admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/college-admin/**
          filters:
            - StripPrefix=1
        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
        - id: counselor-service
          uri: lb://counselor-service
          predicates:
            - Path=/api/counselors/**
          filters:
            - StripPrefix=1
        - id: warning-service
          uri: lb://warning-service
          predicates:
            - Path=/api/warnings/**
          filters:
            - StripPrefix=1
        - id: message-service-ws
          uri: lb://message-service
          predicates:
            - Path=/ws/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
